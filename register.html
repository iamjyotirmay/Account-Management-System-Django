{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:auto">
<h1>Create account</h1><p class="muted">Register to track your own income and expenses.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Register</button></form>
<p>Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>{% endblock %}
